<h1>Threads 텍스트 보관</h1><p>열어 둔 공개 계정의 글을 누적합니다. 새 로그인 없이 현재 탭을 사용합니다.</p>
<button id="start">이 계정 수집 시작 / 계속 누적</button><button id="stop" disabled>중지</button><button id="save" disabled>원본 자료 저장 (JSON v2)</button><button id="markdown" disabled>읽을 문서 저장 (Markdown)</button>
<p id="message" role="status">준비 중</p><small>확정한 글은 브라우저에 남습니다. 다시 시작하면 현재 화면부터 기존 ID와 대조해 누적하며 스크롤 위치는 복원하지 않습니다.<br>자동 탐색은 최대 45분 또는 1,800회입니다. 저장 마무리는 추가 시간이 걸릴 수 있습니다.<br>로그인·보안 안내가 나오면 중단합니다. 전체 범위는 미검증입니다. JSON v2는 기존 데스크톱 가져오기 형식과 다릅니다.</small>
